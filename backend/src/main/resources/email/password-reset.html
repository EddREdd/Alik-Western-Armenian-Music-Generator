<h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;color:#004144;">Reset your password</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#1a1a1a;">
  Use this 5-digit code to reset your Alik password. It expires soon for your security.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px;">
  <tr>
    <td align="center" style="padding:18px 16px;background-color:#f5f1eb;border:1px solid #d4cec6;border-radius:8px;">
      <span style="font-size:32px;font-weight:700;letter-spacing:0.35em;color:#004144;font-family:'Courier New',Courier,monospace;">{{otpCode}}</span>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#5c5c5c;">
  If you did not request a password reset, you can safely ignore this email.
</p>
<p style="margin:0;font-size:14px;line-height:1.6;color:#5c5c5c;">
  Return to Alik: <a href="{{appUrl}}" style="color:#004144;text-decoration:none;font-weight:600;">{{appUrl}}</a>
</p>
