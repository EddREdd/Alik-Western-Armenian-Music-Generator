<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f1eb;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f5f1eb;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background-color:#ffffff;border:1px solid #d4cec6;border-radius:10px;overflow:hidden;">
          <tr>
            <td style="background-color:#004144;padding:28px 32px;text-align:center;">
              <p style="margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:0.08em;color:#ffffff;">Alik</p>
              <p style="margin:0;font-size:13px;font-weight:500;color:#f29a4e;">Western Armenian Music Generator</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 24px;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="border-top:1px solid #e8e2da;padding-top:20px;text-align:center;">
                    <p style="margin:0 0 8px;font-size:12px;line-height:1.5;color:#5c5c5c;">
                      Alik Foundation &middot; Create original Western Armenian music with AI
                    </p>
                    <p style="margin:0;font-size:12px;line-height:1.5;color:#5c5c5c;">
                      Questions? <a href="mailto:{{supportEmail}}" style="color:#004144;text-decoration:none;font-weight:600;">{{supportEmail}}</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
