<h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;color:#004144;">You're invited to Alik</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#1a1a1a;">
  You have been selected to join the Alik pilot program. Use the invite code below when you register.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px;">
  <tr>
    <td align="center" style="padding:18px 16px;background-color:#f5f1eb;border:1px solid #d4cec6;border-radius:8px;">
      <span style="font-size:20px;font-weight:700;letter-spacing:0.08em;color:#004144;font-family:'Courier New',Courier,monospace;">{{inviteCode}}</span>
    </td>
  </tr>
</table>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
  <tr>
    <td style="border-radius:8px;background-color:#e8742a;">
      <a href="{{registerUrl}}" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">Create your account</a>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:14px;line-height:1.6;color:#5c5c5c;">
  This invite is personal. If you were not expecting this message, you can ignore it.
</p>
